services:
  db:
    image: postgres:16-alpine
    container_name: fleet_db
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-metabase-db.sql:/docker-entrypoint-initdb.d/init-metabase-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fleet_app
    environment:
      DATABASE_URL: postgresql+asyncpg://fleet:fleet@db:5432/fleet_analytics
      REDIS_URL: redis://redis:6379/0
      SECRET_TOKEN: demo-token-change-in-prod
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fleet_celery_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://fleet:fleet@db:5432/fleet_analytics
      REDIS_URL: redis://redis:6379/0
      SECRET_TOKEN: demo-token-change-in-prod
      FLEET_API_URL: http://app:8000
    volumes:
      - ./app:/app
    depends_on:
      - app
      - redis
    command: celery -A tasks worker --loglevel=info

  celery_beat:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fleet_celery_beat
    environment:
      DATABASE_URL: postgresql+asyncpg://fleet:fleet@db:5432/fleet_analytics
      REDIS_URL: redis://redis:6379/0
      SECRET_TOKEN: demo-token-change-in-prod
      FLEET_API_URL: http://app:8000
    volumes:
      - ./app:/app
    depends_on:
      - app
      - redis
    command: celery -A tasks beat --loglevel=info

  metabase:
    image: metabase/metabase:latest
    container_name: fleet_metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: fleet
      MB_DB_PASS: fleet
      MB_DB_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
